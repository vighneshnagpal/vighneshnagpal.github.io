<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos &mdash; Vighnesh Nagpal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@400;500&family=Karla:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eaf2f7;
    --panel:#dfe9ef;
    --line:#cbd9e2;
    --ink:#23261f;
    --dim:#4b5044;
    --muted:#575e50;
    --leaf:#3b6336;
    --marigold:#8f5a09;
    --cosmos:#9e4259;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:Karla,system-ui,sans-serif;font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow-x:hidden;
  }
  a{color:var(--leaf);text-decoration:none}
  a:hover{color:var(--cosmos)}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:3px;border-radius:2px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;width:100%}

  /* drifting petals sit above the wash, below the content */
  #petals{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.9}
  .clouds{position:fixed;left:0;top:0;width:100%;height:clamp(150px,26vh,300px);z-index:0;pointer-events:none;opacity:.85}
  .flora{
    position:fixed;left:0;bottom:0;width:100%;height:clamp(150px,27vh,300px);
    z-index:0;pointer-events:none;
  }
  .sky{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(720px 380px at 80% 6%, rgba(255,243,206,.70), rgba(255,243,206,0) 68%),
      linear-gradient(180deg,#a9d2ee 0%,#c4e0f1 30%,#dcecf3 58%,#eef3ea 82%,#f1f3e6 100%);
  }

  /* ---------- bar ---------- */
  .topbar{position:relative;z-index:3;border-bottom:1px solid var(--line);background:rgba(233,242,248,.74);backdrop-filter:blur(10px)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:20px}
  .brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
  .topbar nav{display:flex;gap:24px;flex-wrap:wrap;justify-content:flex-end}
  .topbar nav a{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .topbar nav a:hover{color:var(--leaf)}
  .topbar nav a[aria-current="page"]{color:var(--ink)}
  .topbar nav a[aria-current="page"]::after{content:"";display:block;height:1px;margin-top:3px;background:var(--leaf)}

  /* ---------- stage ---------- */
  main{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0 clamp(140px,22vh,240px)}
  .stage{width:min(900px,100%);padding:0 28px}
  .lede{margin:0 0 12px;text-align:center}
  .lede h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(26px,4vw,38px);letter-spacing:-.022em;margin:0}
  .lede p{margin:0;color:var(--muted);font-size:15px}

  .frame{
    position:relative;height:min(54vh,520px);aspect-ratio:3/4;width:auto;max-width:100%;
    margin:0 auto;overflow:hidden;
    transition:width .38s ease,height .38s ease;
    background:var(--panel);border:1px solid var(--line);
    box-shadow:0 18px 40px -26px rgba(35,38,31,.5);
  }
  .frame.landscape{height:auto;width:min(860px,100%);aspect-ratio:16/9}
  .slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity .55s ease;pointer-events:none}
  .slide.is-on{opacity:1;pointer-events:auto}
  .slide .ph,.slide img,.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide figcaption{
    position:absolute;left:0;right:0;bottom:0;padding:26px 18px 12px;
    font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#f6f3e9;background:linear-gradient(to top,rgba(26,28,22,.68),rgba(26,28,22,0));
  }

  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:30px}
  #prev{justify-self:end}
  #next{justify-self:start}
  .nav-btn{
    font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:8px 15px;cursor:pointer;transition:border-color .18s,color .18s;
  }
  .nav-btn:hover{border-color:var(--leaf);color:var(--leaf)}
  .dots{display:flex;gap:9px;margin:0;justify-content:center}
  .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);background:transparent;padding:0;cursor:pointer}
  .dot.is-on{background:var(--leaf);border-color:var(--leaf)}
  .count{display:block;text-align:center;margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.08em}

  @media (max-width:560px){
    .topbar nav a.anchor{display:none}
    .stage{padding:0 20px}
    .controls{gap:10px}
    .nav-btn{padding:7px 11px;font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    .slide{transition:none}
    #petals{display:none}
  }
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- slideshow ---------- */
  var slides = [].slice.call(document.querySelectorAll('.slide'));
  var dots   = [].slice.call(document.querySelectorAll('.dot'));
  var count  = document.getElementById('count');
  var frame  = document.getElementById('frame');
  var i = 0, timer = null, DWELL = 5200;

  function show(n){
    i = (n + slides.length) % slides.length;
    slides.forEach(function(s,k){
      var on = k===i;
      s.classList.toggle('is-on', on);
      if (on) frame.classList.toggle('landscape', s.dataset.orient === 'landscape');
      var v = s.querySelector('video');
      if (v){
        if (on){ v.play().catch(function(){}); }
        else { v.pause(); try { v.currentTime = 0; } catch(e){} }
      }
    });
    dots.forEach(function(d,k){ d.classList.toggle('is-on', k===i); });
    count.textContent = (i+1) + ' / ' + slides.length;
  }
  function go(d){ show(i+d); restart(); }
  function restart(){
    if (timer) clearInterval(timer);
    if (!reduce) timer = setInterval(function(){ show(i+1); }, DWELL);
  }

  document.getElementById('next').addEventListener('click', function(){ go(1); });
  document.getElementById('prev').addEventListener('click', function(){ go(-1); });
  dots.forEach(function(d){ d.addEventListener('click', function(){ show(+d.dataset.i); restart(); }); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });
  frame.addEventListener('mouseenter', function(){ if (timer) clearInterval(timer); });
  frame.addEventListener('mouseleave', restart);

  var tx = null;
  frame.addEventListener('touchstart', function(e){ tx = e.touches[0].clientX; }, {passive:true});
  frame.addEventListener('touchend', function(e){
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 42) go(dx < 0 ? 1 : -1);
    tx = null;
  }, {passive:true});

  show(0); restart();

  /* ---------- drifting petals ----------
     light ground, so these are painted normally and washed back toward the
     paper colour, rather than added like light */
  var cv = document.getElementById('petals');
  if (!cv || reduce) return;
  var ctx = cv.getContext('2d');
  var W=0, H=0, P=[], running=true, t=0;
  var mouse = {x:-9999, y:-9999, active:false};
  var HUES = ['232,96,122','242,160,60','246,216,94','181,127,214','111,168,224','239,143,184','143,211,167'];

  function flow(x,y,tt){
    return (Math.sin(x*0.0031 + tt)*Math.cos(y*0.0026 - tt*0.6)
          + 0.5*Math.sin(x*0.0071 - tt*1.2)*Math.cos(y*0.0062 + tt*0.8)) / 1.5;
  }
  function seed(){
    P = [];
    var n = Math.max(40, Math.min(130, Math.round(W*H/14000)));
    for (var k=0;k<n;k++) P.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:0, vy:0, c:HUES[(Math.random()*HUES.length)|0],
      r:Math.random()*2.6+1.3, a:Math.random()*0.16+0.07,
      sp:Math.random()*0.5+0.35, ph:Math.random()*6.28
    });
  }
  function resize(){
    var d = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*d; cv.height = H*d;
    ctx.setTransform(d,0,0,d,0,0);
    ctx.clearRect(0,0,W,H);
    seed();
  }
  function frameLoop(){
    if (!running){ requestAnimationFrame(frameLoop); return; }
    ctx.clearRect(0,0,W,H);
    for (var k=0;k<P.length;k++){
      var p = P[k];
      var ang = flow(p.x, p.y, t) * Math.PI;
      p.vx += Math.cos(ang)*0.022;
      p.vy += Math.sin(ang)*0.018 + 0.013;          /* petals fall */
      if (mouse.active){
        var dx = mouse.x - p.x, dy = mouse.y - p.y, d2 = dx*dx + dy*dy;
        if (d2 < 44100 && d2 > 1){
          var d = Math.sqrt(d2), f = 1 - d/210;
          p.vx -= (dx/d)*f*0.34; p.vy -= (dy/d)*f*0.30;   /* a breeze pushes them aside */
        }
      }
      p.vx *= 0.95; p.vy *= 0.95;
      p.x += p.vx + Math.sin(t*40 + p.ph)*0.22*p.sp;
      p.y += p.vy;
      if (p.y > H+14){ p.y = -14; p.x = Math.random()*W; }
      if (p.x < -14) p.x = W+14; else if (p.x > W+14) p.x = -14;
      ctx.fillStyle = 'rgba(' + p.c + ',' + p.a + ')';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r*1.5, p.r*0.78, p.ph + t*18, 0, 6.2832);
      ctx.fill();
    }
    t += 0.0012;
    requestAnimationFrame(frameLoop);
  }
  window.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  }, {passive:true});
  window.addEventListener('pointerleave', function(){ mouse.active = false; }, {passive:true});
  document.addEventListener('visibilitychange', function(){ running = !document.hidden; });
  var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize, 160); });
  resize(); requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
